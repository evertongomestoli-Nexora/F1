[project]
name = "f1"
version = "0.1.0"
description = ""
authors = [
    {name = "Everton Gomes",email = "evertongomestoli@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "streamlit (<2.0.0)",
    "pandas (<3)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]

[tool.poetry]
packages = [{include = "f1", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit the live OpenF1 API (excluded from default runs)",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 50

[tool.taskipy.tasks]
docs = "mkdocs serve"
docs-build = "mkdocs build"
test = "pytest tests/unit/ --cov=src --cov-fail-under=50"
test-all = "pytest tests/unit/ tests/integration/ --cov=src --cov-fail-under=50"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
